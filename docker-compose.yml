services:
  postgres:
    image: postgres:16-alpine
    container_name: shine-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shine_shop
      POSTGRES_USER: shine
      POSTGRES_PASSWORD: shine_dev_password
    ports:
      - "5432:5432"
    volumes:
      - shine_postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shine -d shine_shop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shine_postgres_data:
